<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aurora Bridge ITP / SWT Encyclopedia — The most comprehensive J-1 guide. Everything from visas to city life.">
  <meta property="og:title" content="ITP / SWT 百科全书 — Aurora Bridge">
  <meta property="og:description" content="从项目介绍到落地生存，J-1 ITP 最完整的中文指南。">
  <title>ITP / SWT 百科全书 — Aurora Bridge</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YEW8C3ERGN"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-YEW8C3ERGN');</script>
  <style>
    .guide-page { display: flex; min-height: 100vh; padding-top: 72px; }
    .guide-sidebar { width: 260px; background: var(--color-deep); padding: 32px 20px; position: fixed; top: 72px; bottom: 0; overflow-y: auto; z-index: 100; border-right: 1px solid rgba(255,255,255,0.06); }
    .guide-sidebar h3 { color: var(--color-gold); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; margin: 24px 0 10px; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .guide-sidebar h3:first-child { margin-top: 0; }
    .guide-sidebar a { display: block; color: var(--color-text-on-dark); font-size: 0.85rem; padding: 8px 12px; border-radius: 6px; transition: all var(--transition-fast); text-decoration: none; }
    .guide-sidebar a:hover, .guide-sidebar a.active { background: rgba(201,169,110,0.12); color: var(--color-gold); }
    .guide-main { flex: 1; margin-left: 260px; padding: 40px 48px; max-width: 1000px; }
    .guide-hero { text-align: center; padding: 60px 0 40px; }
    .guide-hero h1 { font-family: var(--font-display); font-size: 2.8rem; font-weight: 800; color: var(--color-deep); margin-bottom: 16px; }
    .guide-hero p { font-size: 1.15rem; color: var(--color-text-light); max-width: 600px; margin: 0 auto 32px; }
    .guide-search { display: flex; max-width: 520px; margin: 0 auto; }
    .guide-search input { flex: 1; padding: 14px 20px; border: 2px solid var(--color-border); border-radius: 30px 0 0 30px; font-size: 1rem; font-family: var(--font-sans); outline: none; transition: border-color var(--transition-fast); }
    .guide-search input:focus { border-color: var(--accent-electric); }
    .guide-search button { padding: 14px 28px; background: var(--gradient-aurora); color: white; border: none; border-radius: 0 30px 30px 0; font-size: 1rem; font-weight: 600; cursor: pointer; font-family: var(--font-sans); }
    .guide-category-label { display: inline-block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent-electric); font-weight: 600; margin: 48px 0 16px; padding-bottom: 6px; border-bottom: 2px solid var(--accent-electric); }
    .guide-category-label:first-of-type { margin-top: 0; }
    .guide-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 16px; }
    .guide-card { background: var(--color-white); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 24px; cursor: pointer; transition: all var(--transition-smooth); }
    .guide-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--accent-electric); }
    .guide-card .gc-icon { font-size: 2rem; margin-bottom: 10px; }
    .guide-card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; color: var(--color-deep); }
    .guide-card p { font-size: 0.85rem; color: var(--color-text-light); line-height: 1.5; }

    /* Topic modal */
    .guide-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: flex-start; padding: 40px 20px; overflow-y: auto; }
    .guide-modal-overlay.open { display: flex; }
    .guide-modal { background: var(--color-white); border-radius: var(--radius-xl); max-width: 760px; width: 100%; padding: 40px; position: relative; animation: modalIn 0.3s var(--transition-smooth); }
    @keyframes modalIn { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
    .guide-modal-close { position: absolute; top: 16px; right: 20px; font-size: 1.5rem; background: none; border: none; cursor: pointer; color: var(--color-text-light); }
    .guide-modal-close:hover { color: var(--color-text); }
    .guide-modal h2 { font-family: var(--font-display); font-size: 1.8rem; margin-bottom: 20px; color: var(--color-deep); }
    .guide-modal h3 { font-size: 1.15rem; margin: 24px 0 10px; color: var(--color-dark); }
    .guide-modal p { line-height: 1.8; margin-bottom: 12px; color: var(--color-text); }
    .guide-modal ul, .guide-modal ol { padding-left: 20px; margin-bottom: 12px; }
    .guide-modal li { line-height: 1.8; margin-bottom: 6px; }
    .guide-tip { background: linear-gradient(135deg, rgba(99,102,241,0.06), rgba(6,182,212,0.06)); border-left: 3px solid var(--accent-electric); padding: 16px 20px; border-radius: 0 8px 8px 0; margin: 20px 0; font-size: 0.9rem; line-height: 1.7; }
    .guide-compare-table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 0.85rem; }
    .guide-compare-table th { background: #F8FAFC; padding: 10px 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #E2E8F0; }
    .guide-compare-table td { padding: 10px 12px; border-bottom: 1px solid #F1F5F9; }
    .guide-checklist li { list-style: none; margin-bottom: 8px; }
    .guide-timeline { border-left: 2px solid var(--accent-cyan); padding-left: 20px; margin: 16px 0; }
    .guide-tl-item { position: relative; padding: 8px 0 8px 16px; font-size: 0.9rem; line-height: 1.6; }
    .guide-tl-item::before { content: ''; position: absolute; left: -27px; top: 12px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent-cyan); border: 2px solid white; }
    .guide-rank-item { padding: 16px; border-radius: 8px; margin-bottom: 12px; }
    .guide-rank-item.green { background: rgba(16,185,129,0.06); border: 1px solid rgba(16,185,129,0.2); }
    .guide-rank-item.yellow { background: rgba(245,158,11,0.06); border: 1px solid rgba(245,158,11,0.2); }
    .guide-rank-item.red { background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.2); }
    .guide-rank-item h4 { font-size: 0.95rem; margin-bottom: 8px; }

    /* Tools section */
    .guide-tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; margin: 40px 0; }
    .guide-tool-card { background: white; border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 28px; }
    .guide-tool-card h3 { font-size: 1.1rem; margin-bottom: 16px; color: var(--color-deep); }
    .tool-q { margin-bottom: 16px; }
    .tool-q label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--color-text-light); }
    .tool-q select { width: 100%; padding: 10px 14px; border: 1px solid var(--color-border); border-radius: 8px; font-size: 0.9rem; font-family: var(--font-sans); }
    .tool-result { margin-top: 16px; padding: 16px; border-radius: 8px; font-size: 0.9rem; line-height: 1.6; display: none; }
    .tool-result.show { display: block; }
    .tool-result.high { background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.2); color: #065F46; }
    .tool-result.medium { background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.2); color: #92400E; }
    .tool-result.low { background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.15); color: #991B1B; }
    .tool-cost-breakdown { font-size: 0.85rem; }
    .tool-cost-breakdown div { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #F1F5F9; }
    .tool-cost-breakdown div.total { font-weight: 700; font-size: 1rem; border-bottom: none; margin-top: 8px; padding-top: 8px; border-top: 2px solid #E2E8F0; }
    .guide-cta-section { background: var(--gradient-aurora); border-radius: var(--radius-lg); padding: 32px; text-align: center; margin: 48px 0; color: white; }
    .guide-cta-section h3 { font-size: 1.4rem; margin-bottom: 12px; }
    .guide-cta-section .btn { margin-top: 16px; }

    @media (max-width: 768px) {
      .guide-sidebar { display: none; }
      .guide-main { margin-left: 0; padding: 20px; }
      .guide-hero h1 { font-size: 1.8rem; }
      .guide-cards { grid-template-columns: 1fr; }
      .guide-tools { grid-template-columns: 1fr; }
      .guide-modal { padding: 24px; }
    }
  </style>
</head>
<body>

<nav class="nav scrolled">

<div class="guide-page">
  <!-- Sidebar -->
  <aside class="guide-sidebar" id="guide-sidebar"></aside>

  <!-- Main -->
  <main class="guide-main">
    <div class="guide-hero">
      <h1>📚 ITP / SWT 百科全书</h1>
      <p>从零了解 J-1 赴美实习的每一个环节——这里是你最完整的指南</p>
      <div class="guide-search">
        <input type="text" id="guide-search-input" placeholder="搜索你想了解的内容...（如：面签、费用、Sponsor）">
        <button onclick="searchGuide()">搜索</button>
      </div>
    </div>

    <div id="guide-content"></div>

    <!-- Tools -->
    <div style="margin-top: 60px;">
      <h2 style="font-family:var(--font-display);font-size:1.6rem;margin-bottom:8px;">🛠️ 实用工具</h2>
      <p style="color:var(--color-text-light);margin-bottom:24px;">选几道题，帮你算出真实答案</p>

    <!-- CTA -->

      <p>写清楚你的情况，Miguel 给你一对一免费评估</p>
      <a href="consult.html" class="btn btn-primary btn-lg" style="background:white;color:var(--accent-electric);border:none;">立即免费咨询 →</a>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="guide-modal-overlay" id="guide-modal-overlay">
  <div class="guide-modal" id="guide-modal">
    <button class="guide-modal-close" onclick="closeModal()">✕</button>
    <div id="guide-modal-body"></div>
    <div style="margin-top:24px;text-align:center;">
      <a href="consult.html" class="btn btn-primary">这个主题想深入了解？立即咨询 →</a>
    </div>
  </div>
</div>

<button class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script src="js/guide-data.js"></script>
<script src="js/knowledge-base.js"></script>
  <script src="js/ai-assistant.js"></script>
  <script src="js/app.js"></script>
<script>
  const currentLang = 'zh';

  // Build sidebar
  function buildSidebar() {
    const sidebar = document.getElementById('guide-sidebar');
    const categories = [...new Set(guideTopics.map(t => t.category))];
    sidebar.innerHTML = '<h3>📖 目录</h3>' + categories.map(cat => {
      return `<h3>${cat}</h3>` + guideTopics.filter(t => t.category === cat).map(t =>
        `<a href="#topic-${t.id}" onclick="scrollToTopic('${t.id}')">${t.icon} ${t.title.zh}</a>`
      ).join('');
    }).join('');
  }

  // Build content
  function buildContent() {
    const container = document.getElementById('guide-content');
    const categories = [...new Set(guideTopics.map(t => t.category))];
    container.innerHTML = categories.map(cat => {
      return `<div class="guide-category-label">${cat}</div>
        <div class="guide-cards">` +
        guideTopics.filter(t => t.category === cat).map((t, i) => `
          <div class="guide-card reveal-up stagger-${i + 1}" id="topic-${t.id}" onclick="openTopic('${t.id}')">
            <div class="gc-icon">${t.icon}</div>
            <h3>${t.title.zh}</h3>
            <p>${t.summary.zh}</p>
          </div>
        `).join('') + '</div>';
    }).join('');
  }

  // Build tools
  function buildTools() {
    const toolsContainer = document.getElementById('guide-tools');
    toolsContainer.innerHTML = '';

    // Self-test tool
    const testHtml = `<div class="guide-tool-card">
      <h3>📝 ${selfTest.title.zh}</h3>
      ${selfTest.questions.map((q, qi) => `
        <div class="tool-q">
          <label>${qi + 1}. ${q.q.zh}</label>
          <select id="test-${q.id}">
            <option value="">请选择...</option>
            ${q.options.map(o => `<option value="${o.score}">${o.text.zh}</option>`).join('')}
          </select>
        </div>
      `).join('')}
      <button class="btn btn-primary" onclick="runSelfTest()" style="width:100%;margin-top:8px;">查看结果</button>
      <div class="tool-result" id="test-result"></div>
    </div>`;
    toolsContainer.innerHTML += testHtml;

    // Cost calculator
    const calcHtml = `<div class="guide-tool-card">
      <h3>🧮 ${costCalculator.title.zh}</h3>
      ${costCalculator.fields.map(f => `
        <div class="tool-q">
          <label>${f.label.zh}</label>
          <select id="calc-${f.id}">
            <option value="">请选择...</option>
            ${f.options.map((o, oi) => `<option value="${oi}">${o.text.zh}</option>`).join('')}
          </select>
        </div>
      `).join('')}
      <button class="btn btn-primary" onclick="runCalculator()" style="width:100%;margin-top:8px;">计算总预算</button>
      <div class="tool-result" id="calc-result"></div>
    </div>`;
    toolsContainer.innerHTML += calcHtml;

    // Timeline generator
    const tlHtml = `<div class="guide-tool-card">
      <h3>📅 ${timelineGenerator.title.zh}</h3>
      <div class="tool-q">
        <label>选择目标出发月份</label>
        <input type="month" id="tl-month" style="width:100%;padding:10px;border:1px solid var(--color-border);border-radius:8px;font-family:var(--font-sans);">
      </div>
      <button class="btn btn-primary" onclick="runTimeline()" style="width:100%;margin-top:8px;">生成时间轴</button>
      <div class="tool-result" id="tl-result"></div>
    </div>`;
    toolsContainer.innerHTML += tlHtml;
  }

  function scrollToTopic(id) {
    const el = document.getElementById('topic-' + id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function openTopic(id) {
    const topic = guideTopics.find(t => t.id === id);
    if (!topic) return;
    document.getElementById('guide-modal-body').innerHTML = `<h2>${topic.icon} ${topic.title.zh}</h2>` + topic.content.zh;
    document.getElementById('guide-modal-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('guide-modal-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.getElementById('guide-modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
  });

  function searchGuide() {
    const q = document.getElementById('guide-search-input').value.trim().toLowerCase();
    if (!q) return;
    const results = guideTopics.filter(t =>
      t.title.zh.toLowerCase().includes(q) ||
      t.summary.zh.toLowerCase().includes(q) ||
      t.category.toLowerCase().includes(q)
    );
    if (results.length > 0) {
      openTopic(results[0].id);
    } else {
      alert('未找到相关内容，请尝试搜索：面签、费用、Sponsor、住宿、拒签等关键词');
    }
  }

  document.getElementById('guide-search-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') searchGuide();
  });

  // Self-test
  window.runSelfTest = function() {
    let total = 0;
    let allAnswered = true;
    selfTest.questions.forEach(q => {
      const val = parseInt(document.getElementById('test-' + q.id).value);
      if (isNaN(val)) allAnswered = false;
      else total += val;
    });
    const resultDiv = document.getElementById('test-result');
    resultDiv.classList.add('show');
    if (!allAnswered) {
      resultDiv.innerHTML = '请回答所有问题。';
      resultDiv.className = 'tool-result show medium';
      return;
    }
    const result = selfTest.results.find(r => total >= r.min);
    resultDiv.innerHTML = result.text.zh;
    if (total >= 40) { resultDiv.className = 'tool-result show high'; }
    else if (total >= 25) { resultDiv.className = 'tool-result show medium'; }
    else { resultDiv.className = 'tool-result show low'; }
  };

  // Calculator
  window.runCalculator = function() {
    const fc = costCalculator.fixedCosts;
    const ex = costCalculator.exchangeRate;
    let sponsorVal = 3150;
    let flightVal = 4000;
    let cityIdx = 0;
    let allAnswered = true;

    costCalculator.fields.forEach(f => {
      const sel = document.getElementById('calc-' + f.id);
      const idx = parseInt(sel.value);
      if (isNaN(idx)) { allAnswered = false; return; }
      if (f.id === 'sponsor') sponsorVal = f.options[idx].value;
      if (f.id === 'flight') flightVal = f.options[idx].value;
      if (f.id === 'city') cityIdx = idx;
    });

    const resultDiv = document.getElementById('calc-result');
    if (!allAnswered) {
      resultDiv.classList.add('show');
      resultDiv.className = 'tool-result show medium';
      resultDiv.innerHTML = '请选择所有选项。';
      return;
    }

    const cityOpt = costCalculator.fields.find(f => f.id === 'city').options[cityIdx];
    const usdTotal = sponsorVal + fc.sevis + fc.visa + fc.insurance + cityOpt.housing + cityOpt.living;
    const cnyTotal = Math.round(usdTotal * ex + flightVal);
    resultDiv.className = 'tool-result show high';
    resultDiv.innerHTML = `
      <div class="tool-cost-breakdown">
        <div><span>Sponsor 费</span><span>$${sponsorVal.toLocaleString()}</span></div>
        <div><span>SEVIS + 签证费</span><span>$${(fc.sevis + fc.visa).toLocaleString()}</span></div>
        <div><span>保险</span><span>$${fc.insurance}</span></div>
        <div><span>住宿押金+首月</span><span>$${cityOpt.housing.toLocaleString()}</span></div>
        <div><span>首月生活费</span><span>$${cityOpt.living.toLocaleString()}</span></div>
        <div><span>机票</span><span>¥${flightVal.toLocaleString()}</span></div>
        <div class="total"><span>总计</span><span>约 ¥${cnyTotal.toLocaleString()} / $${Math.round(cnyTotal / ex).toLocaleString()}</span></div>
      </div>
      <div style="margin-top:12px;font-size:0.8rem;color:#6B7280;">以上为估算值，实际费用因 Sponsor、城市、机票价格浮动</div>
    `;
  };

  // Timeline
  window.runTimeline = function() {
    const monthInput = document.getElementById('tl-month').value;
    const resultDiv = document.getElementById('tl-result');
    if (!monthInput) {
      resultDiv.classList.add('show');
      resultDiv.className = 'tool-result show medium';
      resultDiv.innerHTML = '请选择目标出发月份。';
      return;
    }
    const [year, month] = monthInput.split('-').map(Number);
    const startDate = new Date(year, month - 1, 1);
    resultDiv.className = 'tool-result show high';
    resultDiv.innerHTML = '<div class="guide-timeline">' + timelineGenerator.months.map(m => {
      const d = new Date(startDate);
      d.setMonth(d.getMonth() + m.offset);
      const label = d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long' });
      return `<div class="guide-tl-item"><strong>${label}：</strong>${m.label.zh}</div>`;
    }).join('') + '</div>';
  };

  document.addEventListener('DOMContentLoaded', () => {
    buildSidebar();
    buildContent();
    buildTools();
  });
</script>
</body>
</html>
